<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>광고 성과 리뷰 | Linkprice</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#17233b;background:#f4f7fc}*{box-sizing:border-box}body{margin:0}header{background:#101e37;color:white;padding:24px max(24px,calc((100vw - 1320px)/2))}header h1{margin:4px 0;font-size:25px}header p{margin:4px 0;color:#aabbd6;font-size:13px}.wrap{max-width:1320px;margin:auto;padding:28px 20px 70px}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}button,select,input{font:inherit;border:1px solid #dbe3f1;border-radius:10px;padding:11px 14px;background:white;color:#203250}button{cursor:pointer}button.active{background:#285be7;color:white;border-color:#285be7}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e5eaf4;border-radius:16px;padding:22px;box-shadow:0 3px 12px #142c5210}.card small{color:#687a98}.card strong{display:block;font-size:26px;margin:10px 0}.card em{font-style:normal;color:#687a98;font-size:12px}.section{margin-top:24px}.section h2{font-size:19px;margin:0 0 15px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}.note{font-size:13px;color:#687a98;line-height:1.7}.chart{height:245px;display:flex;align-items:end;gap:3px;border-bottom:1px solid #e3e9f4;padding-top:22px;overflow:hidden}.bar{flex:1;min-width:3px;background:linear-gradient(#4b85f8,#9abcfb);border-radius:3px 3px 0 0;position:relative}.bar:hover{background:#163dc6}.legend{display:flex;justify-content:space-between;color:#7b8ca7;font-size:12px;margin-top:12px}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;white-space:nowrap}th,td{padding:13px 12px;border-bottom:1px solid #edf0f6;text-align:right;font-size:13px}th{background:#f8faff;color:#687a98;position:sticky;top:0}th:first-child,td:first-child{text-align:left;max-width:320px;overflow:hidden;text-overflow:ellipsis}td:first-child{font-weight:600}tr:hover td{background:#f7faff}.pill{padding:4px 9px;border-radius:20px;background:#eaf1ff;color:#2b5ec5;font-size:12px}.warn{background:#fff5e7;color:#9a6109}.topline{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.foot{margin-top:24px;color:#7b8ca7;font-size:12px;line-height:1.8}@media(max-width:850px){.cards,.grid{grid-template-columns:1fr 1fr}}@media(max-width:550px){.cards,.grid{grid-template-columns:1fr}.card strong{font-size:23px}}
</style></head><body><header><h1>광고 성과 분석 대시보드</h1><p>도담 · 지빌리언즈 | 네이버 SA / 쿠팡 | 업로드 데이터 기반</p></header><main class="wrap"><div class="toolbar"><button id="b0" class="active" onclick="setBrand('도담')">도담</button><button id="b1" onclick="setBrand('지빌리언즈')">지빌리언즈</button><select id="channel" onchange="render()"><option>네이버 SA</option><option>쿠팡</option></select><select id="period" onchange="render()"><option value="all">전체 기간</option><option value="2026-09">2026년 9월</option><option value="2026-10">2026년 10월</option><option value="2026-11">2026년 11월</option></select></div><div id="info" class="note" style="margin-bottom:16px"></div><div class="cards" id="kpis"></div><section class="section grid"><div class="panel"><h2>광고 유형별 성과</h2><div id="types"></div></div><div class="panel"><h2>일별 광고비 추이</h2><div id="chart"></div></div></section><section class="section panel"><div class="topline"><h2>캠페인별 상세 성과</h2><div><input id="search" placeholder="캠페인 검색" oninput="drawTable()" style="width:180px"><select id="sort" onchange="drawTable()"><option value="spend">광고비순</option><option value="revenue">전환매출순</option><option value="roas">ROAS순</option><option value="orders">전환수순</option></select></div></div><div id="campaigns" class="tablewrap"></div></section><section class="section panel" id="productsPanel"><h2>상품별 성과 TOP 20</h2><div id="products" class="tablewrap"></div></section><div class="foot" id="footer"></div></main><script src="data.js"></script><script>
let brand='도담';let current=null;const fmt=n=>Math.round(n||0).toLocaleString('ko-KR');const pct=n=>Number.isFinite(n)?n.toFixed(2)+'%':'-';const ratio=(a,b)=>b?a/b*100:0;const sum=rows=>rows.reduce((a,r)=>{for(const k of ['impressions','clicks','spend','orders','revenue'])a[k]+=(r[k]||0);return a},{impressions:0,clicks:0,spend:0,orders:0,revenue:0});
function setBrand(x){brand=x;document.getElementById('b0').classList.toggle('active',x==='도담');document.getElementById('b1').classList.toggle('active',x==='지빌리언즈');render()}
function table(rows){return '<table><thead><tr><th>항목</th><th>노출수</th><th>클릭수</th><th>광고비</th><th>전환수</th><th>전환매출</th><th>CTR</th><th>CVR</th><th>CPC</th><th>ROAS</th></tr></thead><tbody>'+rows.map(r=>`<tr><td title="${esc(r.name)}">${esc(r.name)}</td><td>${fmt(r.impressions)}</td><td>${fmt(r.clicks)}</td><td>${fmt(r.spend)}원</td><td>${fmt(r.orders)}</td><td>${fmt(r.revenue)}원</td><td>${pct(ratio(r.clicks,r.impressions))}</td><td>${pct(ratio(r.orders,r.clicks))}</td><td>${fmt(ratio(r.spend,r.clicks)/100)}원</td><td><span class="pill ${ratio(r.revenue,r.spend)<100?'warn':''}">${pct(ratio(r.revenue,r.spend))}</span></td></tr>`).join('')+'</tbody></table>'}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function drawTable(){let q=document.getElementById('search').value.toLowerCase(),sort=document.getElementById('sort').value;let rows=current.campaigns.filter(r=>r.name.toLowerCase().includes(q)).sort((a,b)=>(sort==='roas'?ratio(b.revenue,b.spend)-ratio(a.revenue,a.spend):b[sort]-a[sort]));document.getElementById('campaigns').innerHTML=table(rows)}
function render(){let ch=document.getElementById('channel').value,p=document.getElementById('period').value;let base=REPORT_DATA[brand][ch];current=base;if(ch==='쿠팡'&&p!=='all'){let filtered=base.daily.filter(x=>x.name.startsWith(p));let msg=filtered.length?null:'해당 월 데이터 없음';document.getElementById('info').textContent=base.source+' · '+base.metricNote+' · 선택 기간 '+p+(msg?' · '+msg:'');}else{document.getElementById('info').textContent=base.source+' · '+base.metricNote+' · '+base.period}
let isFiltered=ch==='쿠팡'&&p!=='all';let daily=base.daily.filter(x=>!isFiltered||x.name.startsWith(p));let total=sum(isFiltered?daily:base.campaigns);document.getElementById('kpis').innerHTML=[['광고비',fmt(total.spend)+'원','VAT 포함 여부는 원본 기준'],['전환매출',fmt(total.revenue)+'원','광고 기여 전환매출'],['ROAS',pct(ratio(total.revenue,total.spend)),'전환매출 ÷ 광고비'],['전환수',fmt(total.orders)+'건','CVR '+pct(ratio(total.orders,total.clicks))]].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong><em>${x[2]}</em></div>`).join('');
if(isFiltered){let note='<p class="note">월별 캠페인/광고유형 상세 집계는 현재 일별 요약만 제공하므로, 월 선택 시 캠페인·유형 표는 전체 기간 기준입니다.</p>';document.getElementById('types').innerHTML=note+table(base.types);document.getElementById('campaigns').innerHTML=note+table(base.campaigns)}else document.getElementById('types').innerHTML=table(base.types);
if(!daily.length){document.getElementById('chart').innerHTML='<p class="note">이 원본에는 날짜별로 구분 가능한 SA 데이터가 없어 일별 그래프를 제공하지 않습니다.</p>'}else{let max=Math.max(...daily.map(r=>r.spend),1);document.getElementById('chart').innerHTML=`<div class="chart">${daily.map(r=>`<div class="bar" title="${r.name} | 광고비 ${fmt(r.spend)}원" style="height:${Math.max(1,r.spend/max*100)}%"></div>`).join('')}</div><div class="legend"><span>${daily[0].name}</span><span>${daily.at(-1).name}</span></div>`}
drawTable();document.getElementById('productsPanel').style.display=base.products.length?'block':'none';document.getElementById('products').innerHTML=table([...base.products].sort((a,b)=>b.spend-a.spend).slice(0,20));document.getElementById('footer').textContent='데이터 출처: '+base.source+' | 원본 집계 기준을 유지합니다. 네이버 SA는 날짜 필드가 없는 광고raw 시트 기준이며, 쿠팡은 2026년 9월 1일~11월 15일의 1일 전환 데이터를 사용합니다. 서로 다른 매체의 전환 기여 기준은 동일하지 않을 수 있습니다.'}
render();
</script></body></html>
